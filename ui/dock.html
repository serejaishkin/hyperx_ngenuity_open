<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperX NGENUITY Open</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; user-select:none; font-family:"Segoe UI",system-ui,sans-serif; background:rgba(0,0,0,.01); }
  .row { height:100%; display:flex; align-items:center; justify-content:center; gap:5px; cursor:grab; border-radius:9px;
         background:rgba(18,18,22,.78); border:1px solid rgba(255,255,255,.14); }
  svg { width:20px; height:20px; flex:0 0 auto; fill:none; stroke:var(--c,#cfcfcf); stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
        filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)); transition:stroke .25s; pointer-events:none; }
  .pct { font-size:15px; font-weight:700; color:var(--c,#cfcfcf); pointer-events:none; letter-spacing:.2px;
         text-shadow:0 0 2px #000, 0 0 3px #000, 0 1px 2px #000; transition:color .25s; }
  body.s-percent svg, body.s-digits svg { display:none; }
  body.off { --c:#8a8a8a; }
</style>
</head>
<body class="s-icon">
<div class="row" id="row" data-tauri-drag-region>
  <svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>
  <span class="pct" id="pct">—</span>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const listen = window.__TAURI__.event ? window.__TAURI__.event.listen : window.__TAURI__.core.listen;
const $ = (id) => document.getElementById(id);
const dlog = (m) => { try { invoke('dock_log', { msg: String(m) }).catch(() => {}); } catch (e) {} };
window.addEventListener('error', (e) => dlog('script error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => dlog('promise error: ' + (e.reason && e.reason.message || e.reason)));
function color(p) { return p > 50 ? '#35d07f' : p > 20 ? '#f0b429' : '#ef4444'; }
let lastPct = null;
function render() { $('pct').textContent = lastPct === null ? '—' : (document.body.classList.contains('s-digits') ? String(lastPct) : lastPct + '%'); }
function update(st) {
  if (!window.__dockSeen) { window.__dockSeen = true; dlog('first state: connected=' + st?.connected + ' battery=' + st?.battery_percent); }
  const on = !!st?.connected && Number(st?.battery_percent) > 0;
  const p = Math.max(0, Math.min(100, Number(st?.battery_percent ?? 0)));
  document.body.classList.toggle('off', !on);
  document.body.style.setProperty('--c', on ? (st.charging ? '#35d07f' : color(p)) : '');
  lastPct = on ? p : null; render();
}
document.addEventListener('contextmenu', (e) => { e.preventDefault(); invoke('dock_menu').catch((x) => dlog('dock_menu failed: ' + x)); });
$('row').addEventListener('dblclick', () => invoke('show_main_window_cmd').catch(() => {}));
async function syncStyle() {
  try {
    const c = await invoke('get_config');
    const st = c.dock_style === 'digits' ? 'digits' : (c.dock_style === 'percent' || c.dock_style === 'number') ? 'percent' : 'icon';
    document.body.className = document.body.className.replace(/\bs-\w+/g, '').trim() + ' s-' + st;
    render();
  } catch (e) {}
}
dlog('page loaded, tauri event api=' + !!window.__TAURI__.event);
syncStyle(); setInterval(syncStyle, 1500);
const poll = () => invoke('get_device_state').then(update).catch((e) => dlog('get_device_state failed: ' + e));
poll(); setInterval(poll, 2000); // events can be unavailable; polling keeps the value fresh either way
try {
  listen('device-state', e => update(e.payload)).catch(() => {});
  listen('device-disconnected', () => update({ connected: false })).catch(() => {});
} catch (e) { dlog('listen unavailable: ' + e); }
</script>
</body>
</html>
